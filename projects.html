<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án - Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; color: #212121; line-height: 1.6; }
        .top-bar { background-color: #1c1c1c; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
        .top-bar .brand { color: #ffffff; font-size: 16px; font-weight: bold; }
        .top-bar .nav-links a { color: #cccccc; text-decoration: none; margin-left: 20px; font-size: 15px; transition: color 0.2s; }
        .top-bar .nav-links a:hover, .top-bar .nav-links a.active { color: #ffffff; font-weight: bold; }
        .hero-banner { background: linear-gradient(135deg, #2b6cb0 0%, #1565c0 40%, #0d47a1 60%, #072a60 100%); height: 250px; display: flex; justify-content: center; align-items: center; text-align: center; position: relative; overflow: hidden; }
        .hero-banner::before { content: ''; position: absolute; bottom: -50px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; }
        .hero-banner h1 { color: #ffffff; font-family: Georgia, 'Times New Roman', Times, serif; font-size: 64px; font-weight: normal; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); z-index: 1; }
        .content-container { max-width: 1000px; margin: 50px auto; padding: 30px; }
        
        /* Grid 6 dự án */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .project-card {
            background: #f4f4f4;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .project-card:hover {
            transform: translateY(-5px);
        }
        
        .dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        .dark-mode .project-card {
            background: #333;
            color: #ddd;
        }
        
        @media (max-width: 768px) {
            .hero-banner h1 { font-size: 40px; }
            .top-bar { flex-direction: column; gap: 10px; }
            .top-bar .nav-links a { margin: 0 10px; }
        }
    </style>
</head>
<body>
    <nav class="top-bar">
        <div class="brand">Portfolio - Ngô Hữu Phúc</div>
        <div class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="projects.html" class="active">Dự án</a>
            <a href="contact.html">Liên hệ</a>
            <button onclick="toggleDarkMode()" style="margin-left: 10px; padding: 5px; cursor: pointer;">Dark Mode</button>
        </div>
    </nav>
    <header class="hero-banner">
        <h1>Dự Án Nổi Bật</h1>
    </header>
    <main class="content-container">
        <!-- 6 dự án dùng CSS Grid -->
        <div class="projects-grid">
            <div class="project-card"><h3>Dự án 1</h3><p>Todo List bằng JS</p></div>
            <div class="project-card"><h3>Dự án 2</h3><p>Ứng dụng Thời tiết</p></div>
            <div class="project-card"><h3>Dự án 3</h3><p>Portfolio Cá Nhân</p></div>
            <div class="project-card"><h3>Dự án 4</h3><p>Trang web Bán hàng</p></div>
            <div class="project-card"><h3>Dự án 5</h3><p>Clone Giao diện Facebook</p></div>
            <div class="project-card"><h3>Dự án 6</h3><p>Máy tính điện tử</p></div>
        </div>
    </main>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
